name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # perlu untuk membuat GitHub Release saat push tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK sudah terpasang di runner ubuntu-latest.
      # Gradle dipasang langsung, jadi tidak perlu file gradle wrapper di repo.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Cari folder proyek
        run: |
          echo "Isi repo:"; find . -maxdepth 3 -not -path './.git*' | head -50
          SETTINGS=$(find . -name 'settings.gradle*' -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan. Upload seluruh isi proyek (app/, build.gradle.kts, settings.gradle.kts, gradle.properties) ke repo."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Ganti nama APK
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" dist/Cassette-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Cassette-debug-apk
          path: dist/Cassette-debug.apk

      - name: Buat GitHub Release (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Cassette-debug.apk
          generate_release_notes: true
